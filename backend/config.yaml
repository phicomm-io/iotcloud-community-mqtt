db_path: /data/app.db
broker_url: ssl://mosquitto:8883
broker_ca: /run/broker-ca.crt
broker_admin_username: __mqtt_manager
broker_admin_password_file: /run/secrets/broker-password
admin_username: admin
admin_password_file: /run/secrets/admin-password
# HTTPS deployments should set the exact public URL and cookie_secure: true.
public_url: ""
cookie_secure: false
# Exact origins of independent static frontends, e.g. https://your-account.github.io.
allowed_origins: []
# Backend is reachable only through the Compose nginx proxy.
trust_proxy: true
register_level: 1
contact_info: 如需帮助请联系管理员
# Optional platform announcement. Empty by default; admin changes override this
# initial configuration and persist independently in this node's database.
banner:
  enabled: false
  text: ""
  url: ""
  label: ""
mqtt_uri: ""
mqtt_ws_uri: ""
smtp:
  host: ""
  port: 465
  username: ""
  password: ""
  from: ""
  tls: true
listen_addr: :8080

# Optional GitHub OAuth App. Both fields empty keeps GitHub login disabled.
# public_url must be the backend HTTPS origin; keep the secret outside Git.
github:
  client_id: ""
  client_secret_file: ""
