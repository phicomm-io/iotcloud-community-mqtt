services:
  setup:
    profiles: [tools]
    image: phicomm-community-mqtt-backend:local
    build: ./backend
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ./runtime:/runtime
      - ./legacy:/legacy:ro
    command: [init, --output, /runtime]
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./runtime/broker:/mosquitto/security
      - ./runtime/broker-data:/mosquitto/data
    networks: [broker]
  backend:
    image: phicomm-community-mqtt-backend:local
    build: ./backend
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: unless-stopped
    volumes:
      - ./backend/config.yaml:/app/config.yaml:ro
      - ./runtime/app:/data
      - ./runtime/secrets/broker-password:/run/secrets/broker-password:ro
      - ./runtime/secrets/admin-password:/run/secrets/admin-password:ro
      - ./runtime/broker/certs/ca.crt:/run/broker-ca.crt:ro
    environment:
      MQTT_URI: "${MQTT_URI:-}"
      MQTT_WS_URI: "${MQTT_WS_URI:-}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
    depends_on: [mosquitto]
    networks: [broker, web]
  nginx:
    image: phicomm-community-mqtt-web:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on: [backend, mosquitto]
    networks: [broker, web]
networks:
  broker:
  web:
