name: Test and publish IoTCloud platform
on:
  pull_request:
    branches: [main, dev]
    paths: ['**', '!**.md']
  push:
    branches: [main, dev, 'feature/**', 'hotfix/**']
    tags: ['v*']
    paths: ['**', '!**.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: false
jobs:
  platform:
    name: Platform host and browser tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check branch workflow
        run: |
          python3 tools/check_branch_policy.py
          python3 -m unittest discover -s tools -p 'test_*.py' -v
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test account migrations and service
        run: cd backend && go test -race ./... && go vet ./...
      - name: Verify pinned frontend release
        run: python3 scripts/frontend_release.py
      - name: Test real Broker migration and persistence
        run: scripts/test-integration.sh
      - name: Test isolated Broker and browser flows
        run: scripts/test-browser-compose.sh

  publish:
    name: Publish ${{ matrix.image }} to GHCR
    needs: platform
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: web
            context: .
            dockerfile: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve exact release identity
        id: version
        run: python3 tools/platform_release.py metadata --tag "${{ github.ref_name }}" --commit "${{ github.sha }}" --output build/version.json --github-output "$GITHUB_OUTPUT"
      - name: Preserve published candidate images
        if: steps.version.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ ! -f "docs/releases/$RELEASE_TAG.md" ]; then
            echo "::error::Curated candidate release notes are missing; refusing to publish."
            exit 1
          fi
          response=$(mktemp)
          trap 'rm -f "$response" "$response.error"' EXIT
          if gh api --include --silent "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$response" 2> "$response.error"; then
            echo "::error::Candidate release already exists. Reuse its manifest and image digests, or publish a new rc.N; existing candidate images will not be rebuilt."
            exit 1
          fi
          protocol= status= remainder=
          read -r protocol status remainder < "$response" || true
          if [[ "$protocol" != HTTP/* ]] || [ "$status" != 404 ]; then
            echo "::error::Cannot confirm candidate release is absent; refusing to build or change image tags."
            exit 1
          fi
      - name: Read pinned frontend version
        id: frontend
        run: echo "commit=$(python3 -c 'import json; print(json.load(open("frontend.lock.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          flavor: latest=false
          tags: ${{ steps.version.outputs.metadata_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.phicomm.frontend.revision=${{ steps.frontend.outputs.commit }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_VERSION_JSON_BASE64=${{ steps.version.outputs.build_json_base64 }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Record published digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          FRONTEND_COMMIT: ${{ steps.frontend.outputs.commit }}
        run: |
          {
            echo "### $IMAGE"
            echo "Digest: \`$DIGEST\`"
            echo "Frontend: \`$FRONTEND_COMMIT\`"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 tools/platform_release.py image-record --metadata build/version.json --image-type "${{ matrix.image }}" --digest "$DIGEST" --output "build/image-${{ matrix.image }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: platform-release-${{ matrix.image }}
          path: build/image-${{ matrix.image }}.json
          if-no-files-found: error

  release-demo:
    name: Publish tagged release for Wiki demo
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    concurrency:
      group: wiki-platform-demo
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve exact release identity
        id: version
        run: python3 tools/platform_release.py metadata --tag "${{ github.ref_name }}" --commit "${{ github.sha }}" --output build/version.json --github-output "$GITHUB_OUTPUT"
      - name: Fetch and verify the tagged frontend
        run: python3 scripts/frontend_release.py --output build/release-frontend
      - uses: actions/download-artifact@v4
        with:
          pattern: platform-release-*
          path: build/release-images
          merge-multiple: true
      - name: Bind both published images to the release manifest
        run: python3 tools/platform_release.py manifest --tag "${{ github.ref_name }}" --commit "${{ github.sha }}" --records build/release-images --output build/release-manifest.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          notes_file="docs/releases/$RELEASE_TAG.md"
          if [ "$PRERELEASE" = true ] && [ ! -f "$notes_file" ]; then
            echo "::error::Curated candidate release notes are missing; refusing to publish."
            exit 1
          fi
          release_exists=false
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$PRERELEASE" = true ]; then
              gh release create "$RELEASE_TAG" --verify-tag --notes-file "$notes_file" --prerelease --latest=false
            else
              gh release create "$RELEASE_TAG" --verify-tag --generate-notes
            fi
          else
            release_exists=true
          fi
          if [ "$PRERELEASE" = true ]; then
            previous=$(mktemp -d)
            trap 'rm -rf "$previous"' EXIT
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$previous/names"
            missing=()
            for file in frontend.lock.json build/release-manifest.json; do
              name=$(basename "$file")
              if grep -Fxq "$name" "$previous/names"; then
                gh release download "$RELEASE_TAG" --pattern "$name" --dir "$previous"
                if ! cmp -s "$file" "$previous/$name"; then
                  echo "::error::Published candidate asset differs: $name. Reuse the original release or publish a new rc.N."
                  exit 1
                fi
              else
                missing+=("$file")
              fi
            done
            if [ "$release_exists" = true ]; then
              gh release edit "$RELEASE_TAG" --notes-file "$notes_file" --prerelease --latest=false
            fi
            if [ "${#missing[@]}" -gt 0 ]; then
              gh release upload "$RELEASE_TAG" "${missing[@]}"
            fi
          else
            gh release upload "$RELEASE_TAG" frontend.lock.json build/release-manifest.json --clobber
          fi
